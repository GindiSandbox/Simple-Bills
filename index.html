<title>Simple Bills</title>
<style>
/* Layout: one narrow column, one question per screen, big tap targets; results screen = banner, pie, legend, debts, sticky action bar.
   Type: Atkinson Hyperlegible (made for low-vision readers) in two weights for every role. */
:root{
  --bg:#f5f6f2; --surface:#ffffff; --fg:#1b2531; --muted:#576372; --line:#d6dbd4;
  --accent:#1f7a3d; --accent-fg:#ffffff; --ghost:#e7ecf2;
  --green:#1f7a3d; --red:#b71c1c; --orange:#e8790c; --on-color:#ffffff;
  --x-outline:#ffffff; --x-core:#111111; --on-orange:#1b2531;
  --s1:#3a6ea5; --s2:#7b4fa3; --s3:#2a9d8f; --s4:#d4a72c; --s5:#8d6e63; --s6:#d9628f; --s7:#6c757d; --s8:#1d3557;
  --font:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121820; --surface:#1b2430; --fg:#e9eef3; --muted:#9eabb9; --line:#2d3946;
  --accent:#4fbf7a; --accent-fg:#0d1a2a; --ghost:#26323f;
  --green:#2f9a55; --red:#d03a3a; --orange:#ff9a3d;
  --s1:#6a9bd0; --s2:#a98bd0; --s3:#4cc2b3; --s4:#e6c25a; --s5:#b69a8f; --s6:#ec8db3; --s7:#98a3ad; --s8:#7f9cc8;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121820; --surface:#1b2430; --fg:#e9eef3; --muted:#9eabb9; --line:#2d3946;
  --accent:#4fbf7a; --accent-fg:#0d1a2a; --ghost:#26323f;
  --green:#2f9a55; --red:#d03a3a; --orange:#ff9a3d;
  --s1:#6a9bd0; --s2:#a98bd0; --s3:#4cc2b3; --s4:#e6c25a; --s5:#b69a8f; --s6:#ec8db3; --s7:#98a3ad; --s8:#7f9cc8;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:19px;line-height:1.45;margin:0;padding-inline:16px;padding-block:20px 0}
main{max-width:560px;margin-inline:auto;min-width:0;padding-bottom:110px}
h1{font-size:2rem;line-height:1.15;margin:0 0 .4rem;text-wrap:balance}
h2{font-size:1.6rem;line-height:1.2;margin:0 0 .5rem;text-wrap:balance}
p{margin:0 0 1rem}
.eyebrow{font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 .5rem;font-weight:700}
.hint{color:var(--muted);font-size:1.02rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-block:0 16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1 1 140px;min-width:0}
button,.btn{font:inherit;font-weight:700;min-height:58px;padding:12px 18px;border-radius:12px;border:2px solid transparent;cursor:pointer;background:var(--accent);color:var(--accent-fg);text-align:center}
button.ghost{background:var(--ghost);color:var(--fg);border-color:var(--line)}
a.btn.ghost{background:var(--ghost);color:var(--fg);border:2px solid var(--line);border-radius:12px;padding:12px 18px;text-align:center;min-height:58px;box-sizing:border-box}
button.green{background:#27599b;color:var(--on-color)}
button.danger{background:var(--red);color:var(--on-color)}
button.choice{text-align:left;background:var(--surface);color:var(--fg);border-color:var(--line)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:4px solid var(--orange);outline-offset:2px}
label{display:block;font-weight:700;margin-bottom:6px}
input[type=text],input[type=number],textarea{font:inherit;width:100%;min-height:58px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--fg)}
textarea{min-height:130px;font-size:.9rem}
.err{color:var(--red);font-weight:700;min-height:1.4em;margin:.4rem 0 .8rem}
.banner{border-radius:14px;padding:16px 18px;color:var(--on-color);font-weight:700;font-size:1.5rem;line-height:1.2;margin-bottom:14px;text-align:center}
.banner.good{background:var(--green)} .banner.bad{background:var(--red)}
.money{display:flex;justify-content:space-between;gap:12px;font-size:1.1rem;padding-block:4px;font-variant-numeric:tabular-nums}
.money b{font-weight:700}.in b{color:var(--green)}
.pie{display:block;width:100%;max-width:340px;height:auto;margin:6px auto 14px}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.legend li{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;font-variant-numeric:tabular-nums}
.legend .sw{width:22px;height:22px;border-radius:5px}
.legend .nm{min-width:0;overflow-wrap:anywhere}
.pill{display:inline-block;font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:2px 10px;color:var(--on-color);margin-right:8px}
.pill.bad{background:var(--red)}.pill.ok{background:var(--green)}.pill.soon{background:var(--orange);color:var(--on-orange)}
.list{list-style:none;padding:0;margin:0 0 16px;display:flex;flex-direction:column;gap:8px}
.list li{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow-wrap:anywhere}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bar .inner{max-width:560px;margin-inline:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bar button{min-height:56px;padding:8px 6px;font-size:.95rem}
.note{font-size:.95rem;color:var(--muted)}
.list li.item{display:flex;align-items:center;justify-content:space-between;gap:10px}
.list li.item span{min-width:0;flex:1}
.list li.item button{min-height:46px;padding:6px 14px;flex:0 0 auto}
select{font:inherit;width:100%;min-height:58px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--fg)}
.fld{margin-bottom:14px}
.gsvg{display:block;width:100%;max-width:380px;height:auto;margin:6px auto 10px}
.gsvg text{fill:var(--fg);font-family:var(--font)}
.warn{border-left:6px solid var(--orange);padding-left:12px}
@media (prefers-reduced-motion:no-preference){button{transition:filter .12s}button:active{filter:brightness(.9)}}

</style>
</head><body>
<main id="app" aria-live="polite"></main>
<script>
(function(){
'use strict';
var KEY='simpleBills.v1';
var BUDGET_URL='https://gindisandbox.github.io/Simple-Budget/';var FUTURE_URL='https://gindisandbox.github.io/Saving-for-Future/'; /* optional: web address of Simple Budget; shows a link on the first screen when filled in */
var CARS=['Car gas','Car insurance','Car maintenance'];

var VERSION='1.4';

/* ---------- helpers ---------- */
var app=document.getElementById('app');
function h(tag,attrs){var e=document.createElement(tag);attrs=attrs||{};

    if(k==='class')e.className=v;else if(k==='text')e.textContent=v;else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?'':v);});
  for(var i=2;i<arguments.length;i++)add(e,arguments[i]);return e;}
function add(e,c){if(c==null||c===false)return;if(Array.isArray(c)){c.forEach(function(x){add(e,x)});return;}e.append(c.nodeType?c:document.createTextNode(String(c)));}
function uid(){return 'b'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function num(v){v=Number(v);return (isFinite(v)&&v>=0&&v<=1e9)?v:0;}
function str(v,n){return typeof v==='string'?v.slice(0,n):'';}
function money(x){return (x||0).toLocaleString('en-US',{style:'currency',currency:'USD'});}
function parseNum(s){s=String(s).replace(/[$%\s]/g,'');if(/^\d+,\d{1,2}$/.test(s))s=s.replace(',','.');else s=s.replace(/,/g,'');if(s===''||!/^(\d+\.?\d*|\.\d+)$/.test(s))return null;var v=Number(s);return (isFinite(v)&&v>=0&&v<=1e9)?v:null;}
function todayStr(){var d=new Date(),p=function(n){return (n<10?'0':'')+n;};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}

/* ---------- navigation ---------- */
var view=null,hist=[],cur=null;
function show(v){view=v;app.textContent='';v[0](v[1]);window.scrollTo(0,0);}
function go(fn,arg){if(view)hist.push(view);show([fn,arg]);}
function back(){var p=hist.pop();if(!p){home();return;}show(p);}
function jump(fn,arg){hist=[];show([fn,arg]);}
function ask(o){
  var err=h('div',{class:'err',role:'alert'});var input=o.input;
  var form=h('form',{class:'card',onsubmit:function(ev){ev.preventDefault();var r=o.onNext(input?input.value:null);if(r){err.textContent=r;if(input)input.focus();}}},
    o.eyebrow?h('p',{class:'eyebrow',text:o.eyebrow}):null,
    h('h2',{text:o.title}),o.hint?h('p',{class:'hint',text:o.hint}):null,
    input?h('label',{for:input.id,class:'hint',text:o.label||''}):null,input,err,
    h('div',{class:'row'},h('button',{type:'button',class:'ghost',onclick:back,text:'Back'}),h('button',{type:'submit',text:'Next'})));
  app.append(form);if(input)setTimeout(function(){input.focus();},30);}
function numIn(id,val,ph){var i=h('input',{type:'text',inputmode:'decimal',id:id,placeholder:ph||'0',autocomplete:'off'});if(val!=null&&val!=='')i.value=String(Math.round(val*100)/100);return i;}

/* ---------- data: a small copy of each budget (names and amounts only) plus its bills ---------- */
var db=[],storageOk=true,notice='';
function cleanBills(a){return (Array.isArray(a)?a.slice(0,100):[]).map(function(x){x=x||{};var kd=['exp','extra','debt'].indexOf(x.kind)>=0?x.kind:'exp',dd=Math.round(Number(x.day));var okKey=function(k){return /^\d{4}-\d{2}$/.test(String(k||''));};var pm=(Array.isArray(x.paidm)?x.paidm:[]).filter(okKey).map(String);if(okKey(x.paid)&&pm.indexOf(String(x.paid))<0)pm.push(String(x.paid));pm=pm.sort().slice(-12);return {id:str(x.id,40)||uid(),kind:kd,ref:str(x.ref,60),day:(dd>=1&&dd<=31)?dd:1,paid:pm.length?pm[pm.length-1]:'',paidm:pm,added:str(x.added,10)};}).filter(function(x){return x.ref;});}
function clean(b){
  if(!b||typeof b!=='object')return null;
  var arr=function(x){return Array.isArray(x)?x.slice(0,100):[];};
  return {id:str(b.id,40)||uid(),name:str(b.name,60)||'Budget',hasCar:(b.hasCar===true||b.hasCar===false)?b.hasCar:null,
    imported:str(b.imported,10)||todayStr(),
    expenses:arr(b.expenses).map(function(e){e=e||{};return {name:str(e.name,60),amount:num(e.amount)};}).filter(function(e){return e.name&&e.amount>0;}),
    extras:arr(b.extras).map(function(e){e=e||{};return {name:str(e.name,60),amount:num(e.amount)};}).filter(function(e){return e.name&&e.amount>0;}),
    debts:arr(b.debts).map(function(d){d=d||{};return {type:(DTYPES.indexOf(d.type)>=0?d.type:'Other loan'),name:str(d.name,60),payment:num(d.payment)};}).filter(function(d){return d.payment>0;}),
    srcSaved:(Number(b.srcSaved)>0?Number(b.srcSaved):0),
    bills:cleanBills(b.bills)};}
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&Array.isArray(o.budgets))db=o.budgets.map(clean).filter(Boolean);}}catch(e){storageOk=false;}}
var saveOk=true;
function save(){try{localStorage.setItem(KEY,JSON.stringify({budgets:db}));saveOk=true;}catch(e){storageOk=false;saveOk=false;}return saveOk;}
function upsert(b){var i=db.findIndex(function(x){return x.id===b.id;});if(i>=0)db[i]=b;else db.push(b);save();}
/* opening a newer backup replaces the budget's names and amounts, and keeps the bills already set up */
function itemsOf(bud,kind){var out=[];
  if(kind==='exp')bud.expenses.forEach(function(e){out.push({ref:e.name,amt:e.amount});});
  else if(kind==='extra')bud.extras.forEach(function(e){out.push({ref:e.name,amt:e.amount});});
  else bud.debts.forEach(function(d){out.push({ref:d.name||d.type,amt:d.payment});});
  return out;}
function importBudget(c){var old=db.filter(function(x){return x.id===c.id;})[0];
  if(old){
    /* a bill whose item was renamed in the Budget: if exactly one unlinked item of the same kind has the same amount, follow it */
    old.bills.forEach(function(b){if(billItem(b,c))return;var was=billItem(b,old);if(!was)return;
      var taken={};old.bills.forEach(function(x){if(x.kind===b.kind)taken[x.ref]=1;});
      var cand=itemsOf(c,b.kind).filter(function(i){return !taken[i.ref]&&Math.abs(i.amt-was.amt)<0.005;});
      if(cand.length===1)b.ref=cand[0].ref;});
    var have={};old.bills.forEach(function(b){have[b.kind+'|'+b.ref]=1;});c.bills.forEach(function(b){if(!have[b.kind+'|'+b.ref])old.bills.push(b);});
    c.bills=old.bills;}
  c.imported=todayStr();upsert(c);}

/* ---------- bills ---------- */
var BILL_DAYS=7,MS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function dim(y,m){return new Date(y,m+1,0).getDate();}
function dueOn(day,y,m){var yy=new Date(y,m,1,12);return new Date(yy.getFullYear(),yy.getMonth(),Math.min(day,dim(yy.getFullYear(),yy.getMonth())),12);}
function mkKey(d){return d.getFullYear()+'-'+(d.getMonth()<9?'0':'')+(d.getMonth()+1);}
function ord(n){var t=n%100;if(t>=11&&t<=13)return n+'th';return n+(['th','st','nd','rd'][n%10]||'th');}
function dShort(d){return MS[d.getMonth()]+' '+d.getDate();}
function billItem(b,bud){var a,i;
  if(b.kind==='exp'){a=bud.expenses;for(i=0;i<a.length;i++)if(a[i].name===b.ref)return {label:a[i].name,amt:a[i].amount};}
  else if(b.kind==='extra'){a=bud.extras;for(i=0;i<a.length;i++)if(a[i].name===b.ref)return {label:a[i].name,amt:a[i].amount};}
  else{a=bud.debts;for(i=0;i<a.length;i++)if((a[i].name||a[i].type)===b.ref)return {label:a[i].name||a[i].type,amt:a[i].payment};}
  return null;}
function isPaid(b,key){return b.paid===key||(Array.isArray(b.paidm)&&b.paidm.indexOf(key)>=0);}
function markPaid(b,key){var l=(Array.isArray(b.paidm)?b.paidm.slice():[]);if(b.paid&&l.indexOf(b.paid)<0)l.push(b.paid);if(l.indexOf(key)<0)l.push(key);l.sort();b.paidm=l.slice(-12);b.paid=b.paidm[b.paidm.length-1];}
function unmarkPaid(b,key){var l=(Array.isArray(b.paidm)?b.paidm:[]).filter(function(k){return k!==key;});b.paidm=l;b.paid=l.length?l[l.length-1]:'';}
function billStatus(b,now){
  var t=new Date(now.getFullYear(),now.getMonth(),now.getDate(),12),y=t.getFullYear(),m=t.getMonth();
  var d0=dueOn(b.day,y,m),paid=isPaid(b,mkKey(d0)),added=b.added?new Date(b.added+'T12:00:00'):null;
  var days=Math.round((d0-t)/864e5),n,nd,k,dk;
  /* any month since the bill was added (up to 12 back) that was never marked paid stays overdue; they are grouped into one line */
  var missed=[];for(k=12;k>=0;k--){dk=dueOn(b.day,y,m-k);if(dk<t&&!isPaid(b,mkKey(dk))&&added&&dk>=added)missed.push({due:dk,key:mkKey(dk)});}
  if(!added&&!isPaid(b,mkKey(dueOn(b.day,y,m-1)))&&dueOn(b.day,y,m-1)<t)missed.push({due:dueOn(b.day,y,m-1),key:mkKey(dueOn(b.day,y,m-1))});
  if(!added&&d0<t&&!paid)missed.push({due:d0,key:mkKey(d0)});
  if(missed.length)return {state:'overdue',days:Math.round((t-missed[0].due)/864e5),due:missed[0].due,key:missed[0].key,missed:missed,count:missed.length};
  if(d0>=t&&!paid)return days<=BILL_DAYS?{state:'soon',days:days,due:d0,key:mkKey(d0)}:{state:'later',days:days,due:d0,key:mkKey(d0)};
  n=dueOn(b.day,y,m+1);nd=Math.round((n-t)/864e5);
  var nextPaid=isPaid(b,mkKey(n));
  if(nd<=BILL_DAYS&&!nextPaid)return {state:'soon',days:nd,due:n,key:mkKey(n)};
  return {state:(paid||nextPaid)?'paid':'later',days:nd,due:n,key:mkKey(n),paidNow:paid};}
function whenText(s){
  if(s.state==='overdue'&&s.count>1)return 'OVERDUE: '+s.count+' months not marked paid ('+s.missed.map(function(x){return MS[x.due.getMonth()];}).join(', ')+'). The oldest was due '+dShort(s.due)+'.';
  if(s.state==='overdue')return 'OVERDUE: was due '+dShort(s.due);
  if(s.state==='soon')return s.days===0?'Due today':(s.days===1?'Due tomorrow, '+dShort(s.due):'Due '+dShort(s.due)+' (in '+s.days+' days)');
  if(s.state==='paid')return 'Paid for this month. Next due '+dShort(s.due);
  return 'Next due '+dShort(s.due);}
function billLines(){var out=[],now=new Date();
  db.forEach(function(bud){(bud.bills||[]).forEach(function(b){var it=billItem(b,bud);if(!it||!(it.amt>0))return;var s=billStatus(b,now);if(s.state==='overdue'||s.state==='soon')out.push({bud:bud,b:b,it:it,s:s});});});
  out.sort(function(x,y){var a=x.s.state==='overdue'?-1000-x.s.days:x.s.days,c=y.s.state==='overdue'?-1000-y.s.days:y.s.days;return a-c;});
  return out;}
function overdueBtns(b,s,after){
  if(s.state==='overdue'&&s.count>1)return h('div',{class:'stack'},
    h('button',{class:'green',onclick:function(){s.missed.forEach(function(x){markPaid(b,x.key);});after();},text:'Mark all paid ('+s.count+' months)'}),
    h('button',{class:'ghost',onclick:function(){markPaid(b,s.key);after();},text:'Mark only the oldest paid'}));
  return h('button',{class:'ghost',onclick:function(){markPaid(b,s.key);after();},text:'Mark paid'});}
function billBanner(){var L=billLines();if(!L.length)return null;
  var card=h('div',{class:'card warn'},h('h2',{text:'Bills due'}));
  L.slice(0,5).forEach(function(x){
    card.append(h('div',{class:'stack'},h('p',{},h('span',{class:'pill '+(x.s.state==='overdue'?'bad':'soon'),text:x.s.state==='overdue'?'Overdue':'Due soon'}),
      x.it.label+(db.length>1?' ('+x.bud.name+')':'')+': '+money(x.it.amt)+'. '+whenText(x.s)),
      overdueBtns(x.b,x.s,function(){upsert(x.bud);home();})));});
  if(L.length>5)card.append(h('p',{class:'hint',text:'And '+(L.length-5)+' more. Open a budget to see them all.'}));
  return card;}
var status=h('p',{class:'note',role:'status'});
function billsScreen(){
  status.textContent='';
  app.append(h('h1',{text:cur.name}),h('p',{class:'hint',text:'Amounts come from your budget copy (opened '+cur.imported+'), so nothing is counted twice. If you change an amount in Simple Budget, save a new copy there and open it here.'}));
  var now=new Date();
  if(!cur.bills.length)app.append(h('p',{class:'hint',text:'No bills yet. Tap Add a bill.'}));
  cur.bills.forEach(function(b){var it=billItem(b,cur),box=h('div',{class:'card'});
    if(!it||!(it.amt>0)){box.append(h('h2',{text:b.ref}),h('p',{class:'warn',text:'This is not in your budget copy with an amount anymore, so no reminders will show. If you renamed it in Simple Budget, tap It was renamed.'}),
      h('button',{class:'green',style:'margin-bottom:12px',onclick:function(){go(billRelink,{id:b.id});},text:'It was renamed'}),
      h('button',{class:'danger',onclick:function(){go(billRemoveAsk,{id:b.id});},text:'Remove this bill'}));}
    else{var s=billStatus(b,now),isPaidNow=(s.state==='paid')||isPaid(b,s.key),actKey=(s.state==='paid')?(isPaid(b,s.key)?s.key:mkKey(dueOn(b.day,now.getFullYear(),now.getMonth()))):s.key;
      box.append(h('h2',{text:it.label}),h('div',{class:'money'},h('span',{text:'Each month'}),h('b',{text:money(it.amt)})),
        h('p',{},h('span',{class:'pill '+(s.state==='overdue'?'bad':(s.state==='soon'?'soon':'ok')),text:s.state==='overdue'?'Overdue':(s.state==='soon'?'Due soon':(s.state==='paid'?'Paid':'On track'))}),'Due on the '+ord(b.day)+' of each month. '+whenText(s)),

function lkUnlockScreen(done){
